<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Loopy</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="auth-overlay">
    <div class="auth-backdrop"></div>
    <section class="auth-panel">
      <div class="auth-side">
        <a href="../landing/index.html" class="brand brand-light">
          <img src="../assets/images/loopy.png" alt="Loopy" class="brand-logo">
        </a>
        <div>
          <p class="eyebrow light">Your next chapter</p>
          <h2>Let's turn your ambition into a plan.</h2>
          <p>One profile. Better guidance. Opportunities chosen for your potential.</p>
        </div>
        <div class="auth-quote">"The clearest way to predict your future is to start building it."</div>
      </div>
      <div class="auth-form-wrap">
        <div class="progress" id="progress-bar">
          <span></span><span></span><span></span><span></span><span></span>
          <small>Step 1 of 5</small>
        </div>
        <a href="../landing/index.html" class="icon-button close-button" aria-label="Close">
          <span id="close-icon"></span>
        </a>
        <form id="signup-form">
          <!-- Step content will be dynamically inserted here -->
        </form>
      </div>
    </section>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/signup.js"></script>
  <script>
    document.getElementById('close-icon').innerHTML = icon('close', 20);

    // Initialize the first step
    updateProgress();
    renderStep();
  </script>
</body>
</html>
